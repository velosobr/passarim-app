version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # O runtime nativo do MapLibre acompanha a versão que o maplibre-compose traz; sobe junto com ele, à mão.
      - dependency-name: "org.maplibre.nativeffi:*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
